modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = "Blocks Spell Engine spell casts when the caster's held weapon has 0 durability remaining."

[[mixins]]
config = "${mod_id}.mixins.json"

[[dependencies.'${mod_id}']]
    modId = "neoforge"
    type = "required"
    versionRange = "[1,)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.'${mod_id}']]
    modId = "minecraft"
    type = "required"
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.'${mod_id}']]
    modId = "spell_engine"
    type = "required"
    versionRange = "[1,)"
    ordering = "AFTER"
    side = "BOTH"
